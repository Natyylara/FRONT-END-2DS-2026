<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula04 - Tela de Login</title>
    <link rel="stylesheet" href="aula04.css">
</head>
    <body>
        <div class= "form-container">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQgDFYLvIjW3NrOmBzDqqJZUnEN78BFRoJnaA&s" alt="tamsy" height="50%" width="50%">
            <h2> Bem vindo de volta!</h2>
            <p>Faça login para acessar sua conta</p>
        
            <form action="">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Informe sua senha" required>
                </div>

                <button type="submit">Entrar</button>
            </form>
            <br>    

            <div class="footer_link">
                Não tem conta? <a href="">Cadastre-se</a>
            </div>
        </div>
        
    </body>
</html>
